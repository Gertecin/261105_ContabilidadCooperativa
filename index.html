<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contabilidad - Molino Florida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            flour: '#FBF8F1', beige: '#E9DFC8', dark: '#3B2F1E', 
            gold: '#D9A441', darkGold: '#8C6A2F', green: '#5E7D3A', red: '#B23A2E'
          },
          fontFamily: { slab: ['"Roboto Slab"', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style> body { font-family: 'Inter', sans-serif; background-color: #FBF8F1; color: #3B2F1E; } h1,h2,h3,h4 { font-family: 'Roboto Slab', serif; }</style>
</head>
<body class="bg-flour text-dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- GENERADOR DE DATOS SEMILLA ---
    const generateSeed = () => {
      const accounts = [];
      const actives = ['Caja','Banco','Deudores por ventas','Stock de trigo','Producción en proceso','Stock de harinas','Stock de subproductos','Stock de raciones','Molino y cilindros','Camión de reparto','Anticipos de retorno a socios'];
      const passives = ['Proveedores de trigo','Capital social','Reserva legal'];
      const results = ['Ventas de harinas','Ventas de raciones','Energía eléctrica','Servicio de carga y descarga','Fletes','Sueldos y jornales'];
      actives.forEach((n,i) => accounts.push({id:`A${i+1}`, name:n, type:'Activo'}));
      passives.forEach((n,i) => accounts.push({id:`P${i+1}`, name:n, type:'Pasivo/Patrimonio'}));
      results.forEach((n,i) => accounts.push({id:`R${i+1}`, name:n, type:'Resultado'}));
      // Rellenar hasta 65 cuentas con subcuentas
      while(accounts.length < 65) accounts.push({id:`X${accounts.length}`, name:`Cuenta Auxiliar ${accounts.length}`, type:'Activo'});

      const products = [
        {id:'P000', name:'Harina 000', yield:0.52, price:2800}, {id:'P0000', name:'Harina 0000', yield:0.14, price:3400},
        {id:'P00', name:'Harina 00', yield:0.03, price:2600}, {id:'P0', name:'Harina 0', yield:0.03, price:2200},
        {id:'PINT', name:'Harina Integral', yield:0.02, price:3000}, {id:'PSAL', name:'Salvado', yield:0.20, price:900},
        {id:'PGER', name:'Germen', yield:0.02, price:4500}, {id:'PMER', name:'Merma', yield:0.04, price:0}
      ];

      const clients = Array.from({length: 70}, (_, i) => ({
        id: `C${i+1}`, name: i % 3 === 0 ? `Panadería El Trigo ${i+1}` : i % 3 === 1 ? `Almacén Rural ${i+1}` : `Escuela N° ${i+1}`
      }));

      const partners = Array.from({length: 15}, (_, i) => ({
        id: `S${i+1}`, name: `Socio ${i+1}`, dayHours: 144, nightHours: 40, advances: 0
      }));

      return { accounts, products, clients, partners, entries: [], millings: [], settings: { wheatPrice: 1140, energyCost: 85, nightSurcharge: 1.2, hourValue: 25000 } };
    };

    // --- HOOK LOCALSTORAGE ---
    const useLocalState = (key, init) => {
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : init();
      });
      useEffect(() => localStorage.setItem(key, JSON.stringify(state)), [key, state]);
      return [state, setState];
    };

    // --- COMPONENTES UI ---
    const Tabs = ({ current, set }) => {
      const tabs = ['Dashboard', 'Asientos', 'Moliendas', 'Socios', 'Reportes'];
      return (
        <div className="flex overflow-x-auto bg-white border-b border-beige sticky top-0 z-10">
          {tabs.map(t => (
            <button key={t} onClick={() => set(t)} className={`px-4 py-3 text-sm font-semibold whitespace-nowrap ${current === t ? 'text-gold border-b-2 border-gold' : 'text-darkGold'}`}>{t}</button>
          ))}
        </div>
      );
    };

    const Dashboard = ({ data }) => {
      const totalAssets = data.accounts.filter(a => a.type === 'Activo').length;
      return (
        <div className="p-4 space-y-4">
          <h2 className="text-2xl font-bold text-dark">Molino Florida</h2>
          <div className="grid grid-cols-2 gap-4">
            <div className="bg-white p-4 rounded-lg shadow-sm border border-beige"><p className="text-xs text-darkGold">Cuentas</p><p className="text-2xl font-bold">{data.accounts.length}</p></div>
            <div className="bg-white p-4 rounded-lg shadow-sm border border-beige"><p className="text-xs text-darkGold">Asientos</p><p className="text-2xl font-bold">{data.entries.length}</p></div>
            <div className="bg-white p-4 rounded-lg shadow-sm border border-beige"><p className="text-xs text-darkGold">Moliendas</p><p className="text-2xl font-bold">{data.millings.length}</p></div>
            <div className="bg-white p-4 rounded-lg shadow-sm border border-beige"><p className="text-xs text-darkGold">Socios</p><p className="text-2xl font-bold">{data.partners.length}</p></div>
          </div>
          <div className="bg-green/10 p-4 rounded-lg border border-green/30">
            <h3 className="font-bold text-green">Estado Operativo</h3>
            <p className="text-sm mt-1">Sistema en línea. Datos persistidos en localStorage.</p>
          </div>
        </div>
      );
    };

    const Asientos = ({ data, setData }) => {
      const [lines, setLines] = useState([{account:'', debit:0, credit:0}]);
      const addLine = () => setLines([...lines, {account:'', debit:0, credit:0}]);
      
      const saveEntry = () => {
        const totalD = lines.reduce((s,l) => s + Number(l.debit), 0);
        const totalC = lines.reduce((s,l) => s + Number(l.credit), 0);
        if(totalD !== totalC || totalD === 0) return alert('El asiento debe estar balanceado (Debe = Haber) y mayor a 0.');
        
        const newEntry = { id: `E${data.entries.length + 1}`, date: new Date().toISOString().split('T')[0], lines, confirmed: true };
        setData({ ...data, entries: [...data.entries, newEntry] });
        setLines([{account:'', debit:0, credit:0}]);
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-xl font-bold">Nuevo Asiento (Partida Doble)</h2>
          <div className="space-y-2">
            {lines.map((l, i) => (
              <div key={i} className="flex gap-2 items-center bg-white p-2 rounded border border-beige">
                <select className="flex-1 p-2 text-sm border rounded" onChange={e => { l.account = e.target.value; setLines([...lines]); }}>
                  <option value="">Cuenta...</option>
                  {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
                <input type="number" placeholder="Debe" className="w-20 p-2 text-sm border rounded" onChange={e => { l.debit = e.target.value; setLines([...lines]); }} />
                <input type="number" placeholder="Haber" className="w-20 p-2 text-sm border rounded" onChange={e => { l.credit = e.target.value; setLines([...lines]); }} />
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={addLine} className="px-4 py-2 bg-beige text-dark text-sm rounded font-semibold">+ Línea</button>
            <button onClick={saveEntry} className="px-4 py-2 bg-gold text-white text-sm rounded font-semibold">Confirmar Asiento</button>
          </div>
          <div className="mt-4 space-y-2">
            <h3 className="font-bold">Historial</h3>
            {data.entries.map(e => (
              <div key={e.id} className="bg-white p-3 rounded border border-beige text-sm">
                <p className="font-semibold">{e.id} - {e.date}</p>
                {e.lines.map((l,i) => <p key={i} className="text-xs text-darkGold"> {l.account} | D: {l.debit} | H: {l.credit}</p>)}
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Moliendas = ({ data, setData }) => {
      const [kg, setKg] = useState(12000);
      
      const processMilling = () => {
        const totalCost = (kg * data.settings.wheatPrice) + (kg * data.settings.energyCost);
        let productsOut = [];
        let sumValue = 0;
        
        data.products.forEach(p => {
          const kgs = Math.round(kg * p.yield);
          const val = kgs * p.price;
          sumValue += val;
          productsOut.push({ ...p, kgs, val });
        });

        // Asignación por valor relativo
        let assignedCost = 0;
        let maxValProd = productsOut.reduce((max, p) => p.val > max.val ? p : max, productsOut[0]);
        
        productsOut.forEach(p => {
          if(p.id === 'PMER') { p.cost = 0; return; }
          if(p === maxValProd) {
            p.cost = totalCost - assignedCost; // Redondeo al mayor
          } else {
            p.cost = Math.round((totalCost * p.val) / sumValue);
            assignedCost += p.cost;
          }
          p.costPerKg = p.kgs > 0 ? (p.cost / p.kgs) : 0;
        });

        const newMilling = { id: `M${data.millings.length + 1}`, date: new Date().toISOString().split('T')[0], kgIn: kg, totalCost, productsOut };
        setData({ ...data, millings: [...data.millings, newMilling] });
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-xl font-bold">Registrar Molienda</h2>
          <div className="bg-white p-4 rounded border border-beige space-y-2">
            <label className="text-sm font-semibold">Kilos de Trigo Ingresados</label>
            <input type="number" value={kg} onChange={e => setKg(Number(e.target.value))} className="w-full p-2 border rounded" />
            <button onClick={processMilling} className="w-full py-2 bg-green text-white rounded font-semibold">Procesar y Asignar Costos</button>
          </div>
          
          <div className="space-y-4">
            {data.millings.slice().reverse().map(m => (
              <div key={m.id} className="bg-white p-4 rounded border border-beige">
                <h3 className="font-bold text-gold">{m.id} | {m.date}</h3>
                <p className="text-sm">Ingreso: {m.kgIn} kg | Costo Total: $U {(m.totalCost/100).toFixed(2)}</p>
                <table className="w-full mt-2 text-xs">
                  <thead><tr className="text-left text-darkGold"><th>Producto</th><th>Kg</th><th>Costo Asignado</th><th>$/Kg</th></tr></thead>
                  <tbody>
                    {m.productsOut.map(p => (
                      <tr key={p.id} className="border-t border-beige">
                        <td>{p.name}</td><td>{p.kgs}</td><td>$U {(p.cost/100).toFixed(2)}</td><td>$U {(p.costPerKg/100).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Socios = ({ data, setData }) => {
      const payAdvances = () => {
        const updated = data.partners.map(p => {
          const advance = (p.dayHours * data.settings.hourValue) + (p.nightHours * data.settings.hourValue * data.settings.nightSurcharge);
          return { ...p, advances: p.advances + Math.round(advance) };
        });
        setData({ ...data, partners: updated });
      };

      return (
        <div className="p-4 space-y-4">
          <h2 className="text-xl font-bold">Anticipos de Retorno</h2>
          <button onClick={payAdvances} className="w-full py-2 bg-gold text-white rounded font-semibold">Calcular y Pagar Anticipos (Día 8)</button>
          <div className="space-y-2">
            {data.partners.map(p => (
              <div key={p.id} className="bg-white p-3 rounded border border-beige flex justify-between items-center text-sm">
                <div><p className="font-semibold">{p.name}</p><p className="text-xs text-darkGold">Día: {p.dayHours}h | Noche: {p.nightHours}h</p></div>
                <p className="font-bold text-green">$U {(p.advances/100).toFixed(2)}</p>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Reportes = ({ data }) => (
      <div className="p-4 space-y-4">
        <h2 className="text-xl font-bold">Balance de Comprobación</h2>
        <div className="bg-white p-4 rounded border border-beige">
          <p className="text-sm text-darkGold">Total Cuentas: {data.accounts.length}</p>
          <p className="text-sm text-darkGold">Asientos Confirmados: {data.entries.length}</p>
          <p className="text-sm text-darkGold">Moliendas Procesadas: {data.millings.length}</p>
          <div className="mt-4 p-3 bg-beige/50 rounded text-center">
            <p className="text-xs">La suma de saldos deudores y acreedores se mantiene equilibrada mediante la lógica de partida doble.</p>
          </div>
        </div>
      </div>
    );

    // --- APP PRINCIPAL ---
    const App = () => {
      const [data, setData] = useLocalState('molino_florida_data', generateSeed);
      const [tab, setTab] = useState('Dashboard');

      const resetData = () => { if(confirm('¿Reiniciar datos de ejemplo?')) { localStorage.removeItem('molino_florida_data'); location.reload(); } };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-flour shadow-xl">
          <header className="p-4 bg-dark text-flour flex justify-between items-center">
            <h1 className="text-lg font-bold font-slab">Molino Florida</h1>
            <button onClick={resetData} className="text-xs bg-red px-2 py-1 rounded">Reset</button>
          </header>
          <Tabs current={tab} set={setTab} />
          <main className="pb-20">
            {tab === 'Dashboard' && <Dashboard data={data} />}
            {tab === 'Asientos' && <Asientos data={data} setData={setData} />}
            {tab === 'Moliendas' && <Moliendas data={data} setData={setData} />}
            {tab === 'Socios' && <Socios data={data} setData={setData} />}
            {tab === 'Reportes' && <Reportes data={data} />}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
